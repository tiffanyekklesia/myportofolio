{% extends "base.html" %}

{% block title %}
Register - Tiffany Ekklesia
{% endblock title %}

{% block content %}

<section class="container">

    <h2>Register</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Register
        </button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'main:login' %}">Login</a>
    </p>

</section>

{% endblock content %}
